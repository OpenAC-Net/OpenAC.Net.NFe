# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  DOTNET_NOLOGO: 'true'

defaults:
  run:
    shell: pwsh

jobs:
  build_solution:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.x
            9.x
            10.x

      - name: Restore NuGet packages
        run: dotnet restore OpenAC.Net.NFe.slnx

      - name: Build solution
        run: dotnet build OpenAC.Net.NFe.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test --project OpenAC.Net.NFe.Tests/OpenAC.Net.NFe.Tests.csproj --configuration Release --no-build --report-trx --results-directory "$env:GITHUB_WORKSPACE/TestResults"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ${{ github.workspace }}/TestResults/**
          if-no-files-found: warn
          retention-days: 7
